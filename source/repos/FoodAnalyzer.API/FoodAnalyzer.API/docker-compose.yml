version: '3.8'

services:
  food-api:
    image: foodanalyzer-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=5432;Database=FoodAnalyzerDb;Username=postgres;Password=1234